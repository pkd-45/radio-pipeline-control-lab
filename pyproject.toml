[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-pipeline-control-lab"
version = "0.3.0"
description = "A tested synthetic radio-interferometry pipeline with execution control, monitoring, provenance, and Slurm planning."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8"]
authors = [{name = "Pratyush Kumar Das"}]
license = {text = "MIT"}
keywords = ["radio astronomy", "interferometry", "scientific pipelines", "Slurm", "observability"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Astronomy",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]
kafka = ["confluent-kafka>=2.5"]
tango = ["pytango>=10"]

[project.scripts]
radio-pipeline-lab = "radio_pipeline_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["confluent_kafka", "tango", "tango.*"]
ignore_missing_imports = true
