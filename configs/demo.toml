[run]
run_id = "portfolio-demo"
work_dir = "../demo-output"
seed = 23
image_size = 64
n_antennas = 8
n_visibilities = 5000
calibrator_samples_per_antenna = 32
noise_std = 0.012
rfi_fraction = 0.015
rfi_sigma = 30.0
max_retries = 1
fail_once_stage = ""

[qa]
max_visibility_nrmse = 0.20
max_gain_error = 0.15
min_flag_recall = 0.65
max_flag_false_positive_rate = 0.02
max_image_nrmse = 0.45

[resources.simulate]
cpus = 1
memory_gb = 2
walltime = "00:05:00"

[resources.flag]
cpus = 1
memory_gb = 2
walltime = "00:05:00"

[resources.calibrate]
cpus = 2
memory_gb = 4
walltime = "00:10:00"

[resources.image]
cpus = 4
memory_gb = 8
walltime = "00:20:00"

[resources.qa]
cpus = 1
memory_gb = 4
walltime = "00:10:00"
