name: radio-pipeline-integration

services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: radio-pipeline-redpanda
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --node-id
      - "0"
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --rpc-addr
      - 0.0.0.0:33145
      - --advertise-rpc-addr
      - redpanda:33145
    ports:
      - "19092:19092"
      - "19644:9644"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        [
          "CMD",
          "rpk",
          "cluster",
          "info",
          "-X",
          "brokers=127.0.0.1:9092"
        ]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  topic-init:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.12
    container_name: radio-pipeline-topic-init
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        rpk topic create radio-pipeline-events           -X brokers=redpanda:9092         || rpk topic describe radio-pipeline-events           -X brokers=redpanda:9092
    restart: "no"

  etcd:
    image: gcr.io/etcd-development/etcd:v3.6.0
    container_name: radio-pipeline-etcd
    command:
      - /usr/local/bin/etcd
      - --name=etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd=http://etcd:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/etcdctl",
          "--endpoints=http://127.0.0.1:2379",
          "endpoint",
          "health"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  redpanda-data:
  etcd-data:
